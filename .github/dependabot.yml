# Keeps the GitHub Actions used by the workflows up to date. R packages have no
# Dependabot ecosystem, so this covers only .github/workflows/. Minor and patch
# updates arrive together in one pull request each month; a major version
# update arrives as its own pull request so it gets read on its own.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
